name: Pull Slickdeals Hot Deals

on:
  repository_dispatch:
    types: [trigger-deals-pull]
  workflow_dispatch: {}

# Deals + expiration/vote-count checking run back-to-back in one job on
# the same 15-min trigger. The expiration sweep fetches every unexpired
# deal's page concurrently (see MAX_WORKERS in pull_slickexpiration.py)
# and finishes in a couple of minutes, so it comfortably fits inside a
# single run -- no need for a second workflow/trigger to keep it separate
# anymore. cancel-in-progress: true is safe here: if a run ever does take
# too long and gets cancelled, nothing has been committed yet (the commit
# step is last), so the next run just starts clean.
concurrency:
  group: pull-slickdeals
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Pull latest deals
        run: python pull_slickdeals.py

      - name: Check expiration + vote counts
        run: python pull_slickexpiration.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.xml expired.xml
          if git diff --cached --quiet -- deals.xml expired.xml; then
            echo "No changes to deals.xml or expired.xml -- skipping commit."
          else
            git commit -m "Update deals.xml and expired.xml [skip ci]"
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
            git push
          fi
